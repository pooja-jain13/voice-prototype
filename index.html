<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --brand:#0066ee; --brand-tint:#e3f4ff; --canvas:#ebebf0; --sunken:#f6f7f9; --surface:#fff;
  --text:#000; --text2:#6c6c70; --divider:#bcbcc0; --subtle:#ebebf0; --ph:#99a5b2; --disabled:#bcbcc0; --inactive:#a2a2a2;
  --success:#16d374; --amber:#9a5b00; --amber-bg:#fff4d6; --red:#e5484d;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:"Figtree",var(--font);
  --top:env(safe-area-inset-top,0px); --bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--font);color:var(--text);background:#e3f4ff;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
svg{display:block;flex:none}
.ic{display:inline-flex;flex:none}

/* ---------- phone shell ---------- */
.phone{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--canvas);overflow:hidden;overflow:clip}
.status,.home-ind{display:none}
@media (min-width:600px) and (min-height:780px){
  body{background:#dedee4;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:auto}
  .phone{position:relative;top:auto;left:auto;right:auto;bottom:auto;--top:54px;--bottom:22px;width:393px;height:852px;border-radius:55px;box-shadow:0 0 0 11px #121214,0 0 0 13px #3b3b40,0 30px 80px rgba(0,0,0,.35)}
  .status{display:block;position:absolute;top:0;left:0;right:0;height:54px;z-index:300;pointer-events:none}
  .status .time{position:absolute;left:44.6px;top:18px;font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.43px}
  .status .ind{position:absolute;left:282px;top:22.5px}
  .home-ind{display:block;position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#000;z-index:300;pointer-events:none}
}

/* ---------- screens & navigation ---------- */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;overflow:clip;transition:transform .36s cubic-bezier(.2,.85,.25,1)}
.scr.off-right{transform:translateX(100%)}
.scr.off-bottom{transform:translateY(100%)}
.scr.behind{transform:translateX(-24%)}
#sToday{z-index:1;background:linear-gradient(180deg,#e3f4ff 0%,#ebebf0 45%)}
#sSearch{z-index:2;background:var(--canvas);box-shadow:-8px 0 24px rgba(0,0,0,.06)}
#sAdd{z-index:3;background:var(--surface)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.t-headline{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.43px}
.t-body{font-size:17px;line-height:22px;letter-spacing:-.43px}
.t-sub{font-size:15px;line-height:20px;letter-spacing:-.23px}
.t-foot{font-size:13px;line-height:18px;letter-spacing:-.08px}
.t-title3{font-size:20px;line-height:25px;font-weight:600;letter-spacing:-.45px}
.press:active{opacity:.6}

/* ---------- Today ---------- */
.today-head{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 8px}
.date-pick{display:flex;align-items:center;gap:6px;font-size:28px;line-height:34px;font-weight:700;letter-spacing:.38px}
.btn-prem{background:linear-gradient(90deg,#ffc446,#fae292);border-radius:999px;padding:8px 20px;font-size:15px;line-height:20px;font-weight:600;letter-spacing:-.23px;color:#000}
.streak{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.days{display:flex;gap:10px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--text2)}
.day i{width:32px;height:32px;border-radius:16px;background:var(--sunken);border:1px dashed var(--divider)}
.vdiv{width:1px;height:36px;background:var(--divider)}
.flame{position:relative;width:36px;height:44px}
.flame .ic{position:absolute;left:2px;top:0}
.flame b{position:absolute;left:9px;top:24px;width:18px;height:18px;border-radius:9px;background:#fff;display:grid;place-items:center;font-size:11px;line-height:13px;font-weight:600}
.today-content{display:flex;flex-direction:column;gap:8px;padding:8px 16px calc(var(--bottom) + 110px)}
.card{background:#fff;border-radius:20px;padding:20px 24px;display:flex;flex-direction:column;gap:12px;position:relative}
.card .row2{display:flex;justify-content:space-between;align-items:baseline}
.val{display:flex;gap:4px;align-items:baseline}
.val .big{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.26px}
.val .mid{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.43px}
.val .goal{font-size:13px;line-height:18px;color:var(--text2);letter-spacing:-.08px}
.track{height:8px;border-radius:4px;background:var(--subtle)}
.macros{display:flex;gap:16px}
.macros>div{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.swap{position:absolute;left:327px;top:10px}
@media (max-width:420px){.swap{left:auto;right:10px}}
.adslot{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:8px}
.app-ad{width:320px;max-width:100%;height:90px;background:#fff;display:flex;align-items:center;gap:12px;padding:0 12px 0 20px}
.app-ad .appicon{width:44px;height:44px;border-radius:10px;background:#6b5cf2;flex:none}
.app-ad .copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.btn-primary-sm{background:var(--brand);color:#fff;border-radius:999px;padding:8px 20px;font-size:15px;line-height:20px;font-weight:600;letter-spacing:-.23px}
.link-blue{color:var(--brand)}
.meals-h{display:flex;justify-content:space-between;align-items:center;padding:16px 2px 0;font-weight:600}
.meal{background:#fff;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.meal .name{flex:1}
.meal .more{color:var(--inactive);font-size:13px;font-weight:600;letter-spacing:-.08px}
.btn-tonal{background:var(--brand-tint);color:var(--brand);border-radius:999px;padding:8px 20px;font-size:15px;line-height:20px;font-weight:600;letter-spacing:-.23px}
.mcard{background:#fff;border-radius:14px;overflow:hidden}
.mc-hd{display:flex;justify-content:space-between;align-items:baseline;padding:15.7px 16.6px 0}
.mc-t{font-family:var(--display);font-weight:700;font-size:21px;color:#0b0f1a}
.mc-c{font-weight:700;font-size:17.5px;color:#0b0f1a}
.mc-div{height:.75px;background:#dadbe0;margin:14px 16.6px 0}
.sw.sw-row{border-radius:0;transition:height .26s ease,opacity .2s}
.sw.sw-row .sw-del{border-radius:0}
.sw.sw-row.gone{margin-top:0}
.mi{display:flex;align-items:center;gap:12px;background:#fff;padding:14px 16.6px 13px}
.mi-t{flex:1;min-width:0}
.mi-n{display:flex;align-items:center;gap:6px;font-size:17.5px;letter-spacing:-.05px;color:#0b0f1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi-s{font-size:15.5px;letter-spacing:-.05px;color:#6c6c70;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mi-c{font-size:17.5px;color:#0b0f1a}
.mc-ft{display:flex;justify-content:flex-end;padding:6px 16.6px 16px}
.btn-logmore{background:#e1effc;color:#1468f0;border-radius:16.2px;height:32.4px;width:96.2px;font-size:13.75px;font-weight:600;text-align:center}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(73px + var(--bottom));background:#fff;border-top:.5px solid var(--subtle);display:flex;justify-content:space-around;padding-top:10px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;font-size:13px;line-height:18px;letter-spacing:-.08px;color:var(--text2)}
.tab.on{color:#000}
.fab{width:44.3px;height:44.3px;border-radius:999px;background:var(--brand);display:grid;place-items:center;margin-top:-1.5px}
.fab svg{width:32px;height:32px}

/* ---------- Food search / My Recipes ---------- */
.nav{height:52px;position:relative;flex:none}
.nav .lead{position:absolute;left:6px;top:4px;width:44px;height:44px;display:grid;place-items:center}
.nav .trail{position:absolute;right:6px;top:4px;width:44px;height:44px;display:grid;place-items:center}
.nav .ctr{position:absolute;left:50%;top:15px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;white-space:nowrap}
.nav .picker{color:var(--brand)}
.search-wrap{padding:4px 16px 0;flex:none}
.searchf{height:42px;border:1px solid var(--divider);border-radius:999px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 16px}
.searchf input{border:0;outline:0;flex:1;min-width:0;background:transparent;font-size:17px;line-height:22px;letter-spacing:-.43px}
.searchf input::placeholder{color:var(--ph)}
.searchf:focus-within{box-shadow:0 0 0 1.5px var(--brand);border-color:var(--brand)}
.tabs{display:flex;gap:16px;padding:14px 16px 0;flex:none;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.utab{display:flex;flex-direction:column;gap:8px;white-space:nowrap}
.utab i{display:block;height:2.5px;border-radius:1.25px}
.utab.on span{font-weight:600}
.utab.on i{background:#000}
.tiles{display:flex;gap:8px;padding:16px 16px 0}
.tile{flex:1;min-width:0;height:74px;background:#fff;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 8px;color:var(--brand);font-size:13px;line-height:18px;font-weight:600;letter-spacing:-.08px;white-space:nowrap}
.list-h{display:flex;justify-content:space-between;align-items:center;padding:20px 16px 8px}
.circ-btn{width:36px;height:36px;border-radius:999px;background:#fff;display:grid;place-items:center}
.sortchip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--subtle);border-radius:999px;padding:8px 14px 8px 12px}
.rows{display:flex;flex-direction:column;gap:8px;padding:0 12px calc(var(--bottom) + 110px)}
.frow{background:#fff;border-radius:16px;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;transition:box-shadow .3s,background .6s}
.frow .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.frow .nm{display:flex;align-items:center;gap:6px}
.frow .dt{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addbtn{width:44px;height:44px;border-radius:999px;background:var(--sunken);display:grid;place-items:center;flex:none;transition:background .2s}
.addbtn.added{background:var(--brand)}
.frow.fresh{background:#eef5ff;box-shadow:inset 0 0 0 2px #9cc3ff}
.newtag{font-size:11px;line-height:13px;font-weight:600;color:var(--brand);background:var(--brand-tint);border-radius:6px;padding:2px 6px}
.sw{position:relative;border-radius:16px;overflow:hidden;transition:height .26s ease,margin .26s ease,opacity .2s}
.sw-del{position:absolute;top:0;right:0;bottom:0;width:120px;border-radius:16px;background:#ff3b30;display:flex;align-items:center;justify-content:flex-end;padding-right:32px;visibility:hidden}
.sw.reveal .sw-del{visibility:visible}
.sw-fg{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .26s cubic-bezier(.2,.85,.25,1)}
.sw.drag .sw-fg{transition:none}
.sw.gone{opacity:0;margin-top:-8px}
.empty{padding:48px 32px;text-align:center;color:var(--text2)}
.qbar{position:absolute;left:12px;right:12px;bottom:calc(var(--bottom) + 10px);height:64px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 36px;box-shadow:0 1px 3px rgba(10,20,31,.04),0 4px 16px rgba(10,20,31,.08);z-index:5}
.qbar button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;line-height:13px;letter-spacing:.06px}
@media (min-width:600px) and (min-height:780px){.qbar{bottom:24px}}

/* ---------- Add Recipe ---------- */
.topbar{background:var(--sunken);border-bottom:1px solid var(--subtle);padding-top:var(--top);flex:none}
.nav .ttl{position:absolute;left:50%;top:15px;transform:translateX(-50%)}
.adslot2{background:var(--canvas);display:flex;justify-content:center;flex:none}
.banner{width:320px;height:50px;background:#fff;display:flex;align-items:center;gap:6px;padding:0 6px}
.banner .copy{flex:1;min-width:0;display:flex;flex-direction:column}
.banner .adv{font-size:11px;line-height:13px;color:var(--text2);letter-spacing:.06px}
.banner .hl{font-size:13px;line-height:18px;letter-spacing:-.08px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner .cta{display:flex;align-items:center;gap:4px;background:var(--brand);color:#fff;border-radius:999px;padding:6px 8px 6px 12px;font-size:13px;line-height:18px;font-weight:600;letter-spacing:-.08px}
.sec-hd{background:var(--canvas);border-bottom:1px solid var(--subtle);height:44px;display:flex;align-items:flex-end;padding:0 16px 6px;color:var(--text2);font-size:15px;line-height:20px;letter-spacing:-.23px}
.sec-hd.tall{height:48px}
.frow2{background:#fff;border-bottom:1px solid var(--subtle);height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;font-size:17px;line-height:22px;letter-spacing:-.43px}
.frow2 input{border:0;outline:0;text-align:right;flex:1;min-width:0;background:transparent;font-size:17px;letter-spacing:-.43px}
.frow2 input::placeholder{color:var(--disabled)}
.frow2.invalid{background:#fff2f2}
.frow2.invalid>span{color:var(--red)}
.frow2.invalid input::placeholder{color:#f0a0a3}
.trow{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;min-height:54px}
.trow .t1{font-size:15px;line-height:20px;letter-spacing:-.23px}
.trow .t2{font-size:13px;line-height:18px;letter-spacing:-.08px}
.switch{width:51px;height:31px;border-radius:15.5px;background:#e5e5ea;position:relative;transition:background .2s;flex:none}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .2s}
.switch[aria-checked=true]{background:var(--success)}
.switch[aria-checked=true]::after{transform:translateX(20px)}
.ta{display:block;width:100%;min-height:140px;border:0;outline:0;resize:none;padding:16px;font-size:16px;line-height:21px;letter-spacing:-.31px;background:#fff}
.ta::placeholder{color:var(--disabled)}
.ing{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 16px;border-bottom:1px solid var(--subtle);background:#fff}
.ing .m{flex:1;min-width:0;display:flex;flex-direction:column}
.ing .n{font-size:16px;font-weight:500;display:flex;align-items:center;gap:6px}
.ing .a{font-size:13px;color:var(--text2)}
.ing .c{font-size:15px;white-space:nowrap}
.ing .c.unk{color:var(--amber);font-size:13px}
.vtag{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:9px;background:var(--brand-tint);color:var(--brand)}
.add-row{display:flex;align-items:center;gap:8px;color:var(--brand);font-weight:500;padding:14px 16px;width:100%;background:#fff;font-size:17px}
.form-err{color:var(--red);font-size:13px;padding:8px 16px;background:#fff}
.tot{padding:10px 16px;font-size:13px;color:var(--text2);text-align:right;background:#fff}

/* ---------- sheets ---------- */
.layer{position:absolute;inset:0;z-index:50;pointer-events:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.12);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .36s cubic-bezier(.2,.85,.25,1);max-height:calc(100% - var(--top) - 16px);overflow-y:auto;padding:8px 20px calc(var(--bottom) + 14px);box-shadow:0 -6px 24px rgba(0,0,0,.18)}
.layer.open{pointer-events:auto}
.layer.open .backdrop{opacity:1}
.layer.open .sheet{transform:none}
.grab{display:flex;justify-content:center;padding-bottom:10px}
.grab i{width:36px;height:5px;border-radius:2.5px;background:#d1d3d9}
/* upsell (from Figma "Half Sheet / AI Voice Upsell") */
.up-hd{display:flex;align-items:center;justify-content:space-between}
.eyebrow{display:inline-flex;align-items:center;gap:5px;background:#fff1c7;border-radius:12px;padding:4.5px 10px 4.5px 8px;color:#8a5a00;font-size:12.5px;font-weight:600;letter-spacing:.125px}
.xbtn{width:30px;height:30px;border-radius:15px;background:#f0f1f4;display:grid;place-items:center}
.up-h{font-family:var(--display);font-weight:700;font-size:22.5px;line-height:28px;letter-spacing:-.11px;color:#0b0f1a;margin:10px 0 6px}
.up-b{font-size:15.5px;line-height:21px;color:#4a4d54;margin:0 0 14px}
.demo{border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(155deg,#eef4ff 0%,#f5f1ff 71%)}
.speech{display:flex;gap:10px;align-items:center}
.orb{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#3b8bff 0%,#0f55d6 71%);box-shadow:0 4px 10px rgba(20,102,240,.35);flex:none}
.bubble{flex:1;min-width:0;background:#fff;border-radius:4px 14px 14px 14px;padding:9px 11px;display:flex;flex-direction:column;gap:6px}
.bubble p{margin:0;font-style:italic;font-size:13.5px;line-height:18px;color:#3a3d45}
.parsed{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.85);border-radius:10px;padding:7.5px 12px 7.5px 10px}
.parsed .n{flex:1;font-size:14px;font-weight:500;color:#0b0f1a}
.parsed .a{font-size:13.5px;color:#6c6c70}
.parsed .c{font-size:13.5px;font-weight:600;color:#0b0f1a}
.demo-ft{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 0 4px;margin-top:-4px}
.demo-ft span:first-child{font-size:12.5px;font-weight:500;color:#6c6c70}
.speed{display:inline-flex;align-items:center;gap:3px;background:#fff4d6;border-radius:10px;padding:3px 8px 3px 6px;font-size:11.5px;font-weight:600;color:#9a5b00}
.btn-gold{width:100%;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;background:linear-gradient(90deg,#ffc446,#fae292);font-family:var(--display);font-weight:700;font-size:17px;color:#111}
.btn-gold:active{filter:brightness(.96)}
.reassure{text-align:center;font-size:12.5px;color:#8a8d93;letter-spacing:.06px;margin-top:6px}
.btn-tert{display:flex;width:100%;height:36px;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#0b0f1a}
.d-h{font-size:20px;margin:4px 0 6px;text-align:center}
.d-p{font-size:15px;color:var(--text2);text-align:center;margin:0 0 18px}
.btn-danger{width:100%;height:50px;border-radius:25px;background:#ffecec;color:var(--red);font-weight:600;font-size:17px;text-align:center}
.btn-plain{width:100%;height:50px;font-weight:600;font-size:17px;text-align:center;margin-top:6px}
.pw-list{list-style:none;padding:0;margin:4px 0 4px}
.pw-list li{display:flex;gap:10px;align-items:center;font-size:16px;padding:7px 0}
/* edit sheet */
.e-head{display:flex;justify-content:space-between;align-items:center;margin:-4px -6px 14px}
.e-head b{font-size:17px}
.link{color:var(--brand);font-size:17px;padding:8px 6px}
.link.strong{font-weight:600}
.e-note{background:var(--amber-bg);color:#6b4a00;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.35;margin-bottom:14px}
.e-lab{display:block;font-size:13px;color:var(--text2);margin:0 0 6px 2px}
.e-inp{background:#f2f2f7;border-radius:12px;height:48px;display:flex;align-items:center;padding:0 14px;border:2px solid transparent}
.e-inp.bad{border-color:#f3a6a8;background:#fff5f5}
.e-inp input,.e-inp select{border:0;outline:0;background:transparent;width:100%;font-size:17px;height:100%}
.e-sugg{margin:6px 0 10px}
.sg{display:flex;justify-content:space-between;width:100%;padding:11px 4px;font-size:16px;border-bottom:1px solid #f0f0f3}
.sg span{color:var(--text2);font-size:13px}
.sg-none{font-size:13px;color:var(--text2);padding:8px 4px}
.e-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.e-prev{font-size:14px;color:var(--text2);margin:12px 2px 4px}
.e-prev .unk{color:var(--amber)}
.e-remove{display:block;width:100%;text-align:center;color:var(--red);font-size:16px;font-weight:500;padding:14px 0 4px}

/* ---------- voice flow ---------- */
.voice{position:absolute;inset:0;z-index:40;background:#fff;display:flex;flex-direction:column;padding-top:var(--top);transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.85,.25,1)}
.voice.open{transform:none}
.vnav{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;flex:none}
.vnav .l{font-size:17px;color:var(--brand);padding:0 10px;height:44px;min-width:70px}
.vnav .sp{min-width:70px}
.v-body{flex:1;overflow-y:auto;padding:8px 22px 20px;display:flex;flex-direction:column}
.v-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.v-center h2{font-family:var(--display);font-size:24px;margin:14px 0 4px;letter-spacing:-.2px}
.v-center h3{font-size:20px;margin:16px 0 2px}
.v-center p{font-size:16px;color:#4a4d54;line-height:1.45;margin:0 0 6px;max-width:310px}
.v-msg{font-size:14px;color:var(--amber);background:var(--amber-bg);border-radius:10px;padding:8px 12px;margin-top:10px}
.mic-big{width:104px;height:104px;border-radius:52px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#3b8bff 0%,#0f55d6 71%);box-shadow:0 12px 30px rgba(20,102,240,.35);margin-top:26px;position:relative}
.mic-big svg{width:40px;height:40px}
.mic-big:active{transform:scale(.97)}
.mic-big.live::before,.mic-big.live::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid rgba(60,100,240,.45);animation:ring 1.8s ease-out infinite}
.mic-big.live::after{animation-delay:.9s}
@keyframes ring{from{transform:scale(1);opacity:1}to{transform:scale(1.6);opacity:0}}
.v-hint{font-size:14px;color:var(--text2);margin-top:14px}
.v-foot{flex:none;padding:12px 16px calc(var(--bottom) + 12px);border-top:1px solid #eeeef2;background:#fff;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.v-foot .link{text-align:center}
.btn-primary{height:52px;border-radius:26px;background:var(--brand);color:#fff;font-weight:600;font-size:17px;width:100%;text-align:center}
.btn-primary:disabled{opacity:.4}
.btn-secondary{height:50px;border-radius:25px;background:#eef3ff;color:var(--brand);font-weight:600;font-size:17px;width:100%;text-align:center}
.listen-top{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--text2);margin:4px 0 18px}
.rec-dot{width:9px;height:9px;border-radius:5px;background:#ff3b30;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.transcript{font-size:23px;line-height:1.38;font-weight:600;min-height:140px;letter-spacing:-.2px}
.transcript .par{color:#9a9aa1}
.transcript .ph{color:#c2c2c8}
.wave{display:flex;align-items:center;justify-content:center;gap:4px;height:70px;margin:18px 0 6px}
.wave i{display:block;width:5px;border-radius:3px;background:linear-gradient(#5a96ff,#1468f0);height:6px;transition:height .08s linear}
.listen-mic{display:flex;justify-content:center}
.listen-mic .mic-big{width:72px;height:72px;margin-top:6px}
.listen-mic .mic-big svg{width:30px;height:30px}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid #e3e9ff;border-top-color:var(--brand);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.steps{list-style:none;padding:0;margin:14px 0 0;text-align:left}
.steps li{display:flex;align-items:center;gap:10px;font-size:15px;color:#a0a0a6;padding:6px 0}
.steps li .sd{width:20px;height:20px;border-radius:10px;border:2px solid #d6d6db;display:grid;place-items:center;color:#fff}
.steps li.done{color:var(--text)}
.steps li.done .sd{background:#22c46b;border-color:#22c46b}
.err-ic{width:64px;height:64px;border-radius:32px;display:grid;place-items:center;background:var(--amber-bg);color:var(--amber)}
.err-ic svg{width:30px;height:30px}
.said{background:#f5f6fa;border-radius:14px;padding:12px 14px;margin:2px 0 14px}
.said-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text2);margin-bottom:4px}
.said-h button{color:var(--brand);font-weight:600;font-size:14px;display:inline-flex;gap:5px;align-items:center}
.said-t{font-size:15px;font-style:italic;color:#333;line-height:1.4;white-space:pre-line}
.rv-sum{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;font-weight:600;margin:0 2px 8px}
.warn-t{color:var(--amber)}
.rv-list{border-radius:14px;border:1px solid #ececf0;overflow:hidden}
.rv-row{border-top:1px solid #ececf0}
.rv-row:first-child{border-top:0}
.rv-row.warn{background:#fffaf0}
.rv-hit{display:flex;align-items:center;gap:12px;width:100%;padding:12px;text-align:left}
.dot{width:22px;height:22px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
.dot.ok{background:#22c46b}
.dot.warn{background:#f2a100}
.rv-main{flex:1;min-width:0;display:flex;flex-direction:column}
.rv-name{font-size:16px;font-weight:600}
.rv-meta{font-size:13px;color:var(--text2);margin-top:2px}
.rv-cal{font-size:15px;font-weight:600;white-space:nowrap}
.rv-chev{color:#c4c4c9}
.chip{margin:-4px 0 12px 46px;background:#fff;border:1px solid #f0d9a6;color:#6b4a00;border-radius:999px;padding:6px 12px;font-size:14px}
.rv-add{display:flex;gap:8px;align-items:center;color:var(--brand);font-weight:500;font-size:16px;padding:14px 4px}
.rv-total{display:flex;justify-content:space-between;font-size:14px;color:var(--text2);padding:0 4px 4px}
.rv-total b{color:var(--text)}
.toast{position:absolute;left:12px;right:12px;bottom:calc(var(--bottom) + 80px);z-index:70;background:#1c1c1e;color:#fff;border-radius:14px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;transform:translateY(30px);opacity:0;transition:transform .3s,opacity .3s;pointer-events:none}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast button{color:#ffd666;font-weight:600;white-space:nowrap}

/* ---------- moderator panel (outside the phone) ---------- */
.mod-btn.rec::after{content:'';position:absolute;top:3px;right:3px;width:10px;height:10px;border-radius:5px;background:#ff3b30;box-shadow:0 0 0 2px #dedee4;animation:blink 1.2s infinite}
.rec{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;background:#f2f2f5;color:#55555c}
.rec .rd{width:11px;height:11px;border-radius:6px;background:#b0b0b6;flex:none}
.rec b{font-size:15px}
.rec .rt{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:600}
.rec.on{background:#ffeceb;color:#b3261e}
.rec.on .rd{background:#ff3b30;animation:blink 1.2s infinite}
.rec.ended{background:#eaf7ee;color:#1f6b33}
.rec.ended .rd{background:#34c759}
.p-btn.stop{background:#ff3b30;border-color:#ff3b30;color:#fff}
.mod-btn{position:fixed;right:14px;bottom:14px;width:38px;height:38px;border-radius:19px;background:rgba(0,0,0,.07);color:#77777e;display:grid;place-items:center;z-index:900}
/* On phones: show the moderator button only while NOT recording, so participants never see it mid-session */
@media not all and (min-width:600px) and (min-height:780px){
  .mod-btn{right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);width:44px;height:44px;border-radius:22px;background:rgba(20,20,24,.72);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .mod-btn.rec{display:none}
}
.panel{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100vw;background:#fff;z-index:1000;box-shadow:-10px 0 40px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .3s;display:flex;flex-direction:column;font-size:14px;color:#222}
.panel.open{transform:none}
.p-head{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;border-bottom:1px solid #eee}
.p-head b{font-size:16px}
.p-body{flex:1;overflow-y:auto;padding:4px 16px 40px}
.p-body section{padding:12px 0;border-bottom:1px solid #f0f0f3}
.p-body h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8a8a90;margin:0 0 8px}
.p-eng{font-size:13px;line-height:1.4;padding:8px 10px;border-radius:10px;background:#f2f6ff}
.p-eng.warn{background:#fff4dc;color:#6b4a00}
.p-hint,.p-sub{font-size:12px;color:#8a8a90;margin-top:6px}
.p-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.p-row input{flex:1;min-width:120px}
.panel input,.panel select,.panel textarea{border:1px solid #dcdce2;border-radius:8px;padding:7px 9px;font-size:16px;width:100%;background:#fff}
.panel textarea{resize:vertical}
.p-btn,.p-col button{border:1px solid #dcdce2;border-radius:8px;padding:7px 10px;font-size:13px;background:#fafafc;white-space:nowrap}
.p-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.p-btn.danger{color:var(--red);margin-top:8px}
.p-col{display:flex;flex-direction:column;gap:6px}
.p-col button{text-align:left}
.p-tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.p-tile{background:#f6f6f9;border-radius:8px;padding:7px 9px}
.p-tile span{display:block;font-size:11px;color:#8a8a90}
.p-tile b{font-size:14px}
.p-tile.yes b{color:#1f8a3b}
.p-tile.bad b{color:var(--red)}
.p-set{display:block;font-size:12px;color:#55555c;margin-bottom:10px}
.p-set select,.p-set textarea{margin-top:4px}
.p-check{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:10px}
.p-check input{width:auto}
.p-card{background:#f6f6f9;border-radius:8px;padding:10px;font-family:var(--font);font-size:13px;white-space:pre-wrap;margin:0 0 6px}
.p-log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;max-height:320px;overflow-y:auto;border:1px solid #eee;border-radius:8px}
.lg{display:grid;grid-template-columns:44px 1fr;gap:2px 8px;padding:5px 8px;border-top:1px solid #f2f2f4}
.lg:first-child{border-top:0}
.lg.err{background:#fff2f2}
.lg.off{background:#f6f3ff}
.lg-t{color:#999}
.lg-e{font-weight:600}
.lg-d{grid-column:2;color:#666;word-break:break-word}
.p-export{margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:11px}

function fmtUnit(u,q,f){if(!u)return '';const many=Number(q)>1;switch(u){case 'cup':return many?'cups':'cup';case 'piece':{const p=(f&&f.pc)||'whole';return many?(PL[p]||p):p}case 'pinch':return many?'pinches':'pinch';case 'handful':return many?'handfuls':'handful';case 'can':return many?'cans':'can';default:return u}}
function unitLabel(u,f){return({cup:'cup',tbsp:'tbsp',tsp:'tsp',g:'grams',kg:'kg',oz:'oz',lb:'lb',ml:'ml',l:'liters',piece:(f&&f.pc)||'whole',pinch:'pinch',handful:'handful',can:'can'})[u]||u}

 if(u in V){if(g[u])return g[u]*q;for(const b of ['cup','tbsp','tsp'])if(g[b])return g[b]/V[b]*V[u]*q;return 240*V[u]*q}

/* Fix common speech-to-text mishearings of food words before parsing (context-aware, so everyday words are left alone) */
const SPEECH_FIXES=[
 [/\b(tour|toor|tor|tore|door|tur|tool|torr|tour's)\s+(doll|dolls|dull|dal|daal|dahl|dhal|deal|dial|del)\b/gi,'toor dal'],
 [/\b(moon|moons|mung|moong|mong|mooing)\s+(doll|dolls|dull|dal|daal|dahl|dhal|deal)\b/gi,'moong dal'],
 [/\b(masoor|mosur|masur|ma sure|mussoorie|mysore)\s+(doll|dolls|dull|dal|daal|dahl|dhal|deal)\b/gi,'masoor dal'],
 [/\b(chana|channa|chan a)\s+(doll|dolls|dull|dal|daal|dahl|dhal|deal)\b/gi,'chana dal'],
 [/\b(arhar|ar har)\s+(doll|dull|dal|daal|dahl|dhal)\b/gi,'arhar dal'],
 [/\b(doll|dolls|dahl|dhal|daal)\b/gi,'dal'],
 [/\b(somber|sombre|sambal|samba|sambhar|sombar|sambaar|some bar|sum bar|some bars)\b/gi,'sambar'],
 [/\b(tablespoons?|teaspoons?|tbsps?|tsps?|cups?|spoons?|spoonfuls?)\s+(of\s+)?(g|gee|ghi|gi|key|keys|she|he|tea|gees|g's|gee's|ghee|gheeh)\b/gi,(m,u,o)=>u+' '+(o||'')+'ghee'],
 [/\b(gee|ghi|ghie|g h e e)\b/gi,'ghee'],
 [/\b(tumeric|termeric|tumaric|turmaric|tumeric|tomeric|turmerik)\b/gi,'turmeric'],
 [/\b(zeera|jira|gira|jeeraa)\b/gi,'jeera'],
 [/\bhinge\b/gi,'hing'],
 [/\b(carry|kari|curie|kerry|corey|curry)\s+(leaves|leaf|leafs|lease)\b/gi,'curry leaves'],
 [/\b(panir|pan ear|panier|panner|paneer)\b/gi,'paneer'],
 [/\b(beson|basin)\b/gi,'besan'],
 [/\b(raj ma|rajmah|rajma)\b/gi,'rajma'],
 [/\b(tamron|tamarin)\b/gi,'tamarind'],
 [/\b(asafetida|asa fetida|asafoetida)\b/gi,'asafoetida'],
 [/\b(garam marsala|garam masala|gram masala|graham masala)\b/gi,'garam masala'],
 [/\b(green chilly|green chillies|green chilli)\b/gi,'green chili'],
 [/\b(straw berries|straw berry|strawberry's|strawberrys)\b/gi,'strawberries'],
 [/\b(banana's|bananna|bananas)\b/gi,'banana'],
 [/\b(coriander leafs)\b/gi,'coriander leaves']
];
function fixSpeech(text){let s=String(text||'');for(const [re,to] of SPEECH_FIXES)s=s.replace(re,to);return s.replace(/\s+/g,' ').trim()}
/* How well a transcript reads as an ingredient list: used to pick the best of the engine's alternatives */
function ingredientScore(text){const items=parseIngredients(fixSpeech(text));return items.filter(x=>x.foodId).length*2-items.filter(x=>!x.foodId).length}
const VOCAB=(()=>{const s=new Set();FOODS.forEach(f=>{s.add(f.name.toLowerCase().replace(/\s*\(.*\)/,''));f.aliases.forEach(a=>{if(a.length>3)s.add(a)})});return [...s]})();
function tokenize(text){
 let s=' '+String(text).toLowerCase()+' ';
 s=s.replace(/½/g,' 1/2 ').replace(/¼/g,' 1/4 ').replace(/¾/g,' 3/4 ').replace(/⅓/g,' 1/3 ');
 s=s.replace(/table\s+spoons/g,'tablespoons').replace(/table\s+spoon/g,'tablespoon').replace(/tea\s+spoons/g,'teaspoons').replace(/tea\s+spoon/g,'teaspoon');
 s=s.replace(/(\d)\.(\d)/g,'$1#$2').replace(/[,;.!?\n\r:]+/g,' , ').replace(/#/g,'.');
 s=s.replace(/(\d)([a-z])/g,'$1 $2').replace(/-/g,' ').replace(/'/g,'').replace(/[^a-z0-9\/., ]+/g,' ');
 return s.split(/\s+/).filter(Boolean);
}
function numTok(t){if(t==null)return null;if(/^\d+(\.\d+)?$/.test(t))return parseFloat(t);const m=t.match(/^(\d+)\/(\d+)$/);if(m&&+m[2])return m[1]/m[2];return Object.prototype.hasOwnProperty.call(NUMW,t)?NUMW[t]:null}
function readQty(T,i){
 let v=numTok(T[i]);if(v==null)return null;let n=1;const t0=T[i];
 if(t0==='a'||t0==='an'){const nx=T[i+1];if(nx==='half'){v=.5;n=2}else if(nx==='quarter'){v=.25;n=2}else if(nx==='couple'||nx==='few'||nx==='dozen'){v=NUMW[nx];n=2}}
 else if(t0==='half'&&(T[i+1]==='a'||T[i+1]==='an'))n=2;
 if(T[i+n]==='hundred'&&v<100){v*=100;n++}
 if(v>=20&&v<100&&v%10===0&&/^[a-z]+$/.test(T[i+n]||'')){const u=numTok(T[i+n]);if(u!=null&&u>=1&&u<10&&T[i+n]!=='a'&&T[i+n]!=='an'){v+=u;n++}}
 if(/^\d+$/.test(t0)&&/^\d+\/\d+$/.test(T[i+n]||'')){v+=numTok(T[i+n]);n++}
 if((T[i+n]==='quarter'||T[i+n]==='quarters')&&v>=1&&v<4&&t0!=='a'){v*=.25;n++}
 if(T[i+n]==='and'){let j=i+n+1;if(T[j]==='a'||T[j]==='an')j++;if(T[j]==='half'){v+=.5;n=j-i+1}else if(T[j]==='quarter'){v+=.25;n=j-i+1}}
 if(T[i+n]==='of'&&(T[i+n-1]==='couple'||T[i+n-1]==='few'||T[i+n-1]==='dozen'))n++;
 return {v,n};
}
function singular(w){if(w.endsWith('ies'))return w.slice(0,-3)+'y';if(w.endsWith('oes'))return w.slice(0,-2);if(w.endsWith('s')&&!w.endsWith('ss'))return w.slice(0,-1);return w}
function lookup(ph){const k=ph.join(' ');if(ALIAS[k])return ALIAS[k];const s=ph.slice(0,-1).concat(singular(ph[ph.length-1])).join(' ');return ALIAS[s]||null}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function suggest(name){const s=String(name).toLowerCase().trim();if(!s)return null;if(SOUND[s])return SOUND[s];let best=null,bd=99;for(const [al,f] of ALIAS_ENTRIES){const d=lev(s,al);if(d<bd){bd=d;best=f.id}}return bd<=Math.max(1,Math.floor(s.length*.34))?best:null}

function parseIngredients(text){
 const T=tokenize(text),typed=[];let i=0;
 while(i<T.length){
  const t=T[i];
  if(t===','){typed.push({k:'sep'});i++;continue}
  if(numTok(t)==null){let m=null;for(let n=Math.min(MAXN,T.length-i);n>=1;n--){const ph=T.slice(i,i+n);if(ph.includes(','))continue;const f=lookup(ph);if(f){m={f,n,said:ph.join(' ')};break}}
   if(m){typed.push({k:'food',f:m.f,said:m.said});i+=m.n;continue}}
  const q=readQty(T,i);if(q){typed.push({k:'qty',v:q.v,raw:T.slice(i,i+q.n).join(' ')});i+=q.n;continue}
  if(UNITW[t]){typed.push({k:'unit',u:UNITW[t],raw:t});i++;continue}
  if(FILLER.has(t)){i++;continue}
  typed.push({k:'word',w:t});i++;
 }
 const items=[];let groups=[],cur=null;
 const newGroup=()=>{cur={qty:null,unit:null,words:[],raw:[]};groups.push(cur)};
 const flush=()=>{groups.forEach(g=>{if(g.words.length){const name=g.words.join(' ');items.push({id:uid(),foodId:null,name,said:g.raw.concat(g.words).join(' '),qty:g.qty!=null?g.qty:1,unit:g.unit,matched:false,sugg:suggest(name)})}});groups=[];cur=null};
 for(const tk of typed){
  if(tk.k==='sep'){
   // quantity said after the food ("toor dal, one cup,")
   if(groups.length===1&&cur===groups[0]&&!cur.words.length&&(cur.qty!=null||cur.unit)&&items.length){const last=items[items.length-1];if(last.foodId&&!last.explicit){const f=FOODMAP[last.foodId];last.qty=cur.qty!=null?cur.qty:1;last.unit=cur.unit||(f.g.piece?'piece':f.def[0]);last.explicit=true;groups=[]}}
   cur=null;continue}
  if(tk.k==='qty'){if(!cur||cur.qty!=null||cur.unit||cur.words.length)newGroup();cur.qty=tk.v;cur.raw.push(tk.raw);continue}
  if(tk.k==='unit'){if(!cur||cur.unit||cur.words.length)newGroup();cur.unit=tk.u;cur.raw.push(tk.raw);continue}
  if(tk.k==='word'){if(!cur)newGroup();cur.words.push(tk.w);continue}
  if(tk.k==='food'){
   let mine=null;if(groups.length&&cur===groups[groups.length-1]&&!cur.words.length){mine=groups.pop()}
   flush();
   const f=tk.f;let qty,unit;
   if(mine){qty=mine.qty!=null?mine.qty:1;unit=mine.unit||(f.def[0]==='piece'||f.g.piece?'piece':f.def[0]);if(!mine.unit&&mine.qty==null){qty=f.def[1];unit=f.def[0]}}
   else{qty=f.def[1];unit=f.def[0]}
   items.push({id:uid(),foodId:f.id,name:f.name,qty,unit,said:(mine?mine.raw.join(' ')+' ':'')+tk.said,explicit:!!mine,matched:true});
  }
 }
 flush();
 return items;
}
const GARBLE={banana:'bandana',strawberries:'straw berries',milk:'mill',ghee:'gee','toor-dal':'tour doll',carrot:'carats',onion:'on yen',tomato:'tomahto',salt:'sold','green-beans':'green beams','sambar-powder':'some bar powder',rice:'rise',potato:'pot a toe',turmeric:'tumeric'};
const WRONG={banana:'potato',strawberries:'raspberries',milk:'coconut-milk',ghee:'cheese','toor-dal':'masoor-dal',carrot:'cabbage','green-beans':'kidney-beans',onion:'garlic',tomato:'potato',salt:'sugar',rice:'brown-rice','sambar-powder':'garam-masala',potato:'tomato','moong-dal':'masoor-dal',turmeric:'cumin'};
function plantError(items){
 const mode=CFG.plant;if(mode==='off')return;
 const idx=items.map((x,i)=>x.foodId?i:-1).filter(i=>i>=0);if(!idx.length)return;
 const i=idx[idx.length-1],it=items[i];
 if(mode==='unrec'){items[i]=Object.assign({},it,{foodId:null,matched:false,name:GARBLE[it.foodId]||((it.said||it.name).split(' ').pop()+'h'),sugg:it.foodId,planted:'unrec',trueFood:it.foodId})}
 else{let w=WRONG[it.foodId];if(!w){const k=FOODS.findIndex(f=>f.id===it.foodId);w=FOODS[(k+1)%FOODS.length].id}const wf=FOODMAP[w];items[i]=Object.assign({},it,{foodId:wf.id,name:wf.name,planted:'wrong',trueFood:it.foodId})}
}

function engineName(){if(CFG.engine==='sim')return 'sim';if(dict)return 'claude';if(!inClaude&&SR)return 'web';return 'none'}

const VS={active:false,stopping:false,engine:null,final:'',partial:'',err:null,rec:null,t0:0,level:0,ivWave:null,ivTimer:null,silT:null,simIv:null,simT:null};
const vText=()=>(VS.final+' '+VS.partial).replace(/\s+/g,' ').trim();
function vClear(){clearInterval(VS.ivWave);clearInterval(VS.ivTimer);clearTimeout(VS.silT);clearInterval(VS.simIv);clearTimeout(VS.simT)}
function vReset(){vClear();Object.assign(VS,{active:false,stopping:false,final:'',partial:'',err:null,rec:null,level:0})}
function activity(){

function micStart(){
 if(VS.active)return;
 const eng=engineName();vReset();VS.engine=eng;VMSG='';
 if(eng==='none'){log('voice_unavailable',{inClaude,dictChecked});setV('unsupported');return}
 if(eng==='claude'){
  let p;try{p=dict.start()}catch(err){micFail(err);return}
  beginListening();Promise.resolve(p).catch(micFail);return;

  VS.base='';VS.restarts=0;
  if(!startWebRec(true))return;
  beginListening();return;
 }

  if(!VS.active||k>=words.length){clearInterval(VS.simIv);return}

  if(/[,.]$/.test(words[k-1])||VS.partial.split(' ').length>=7){VS.final+=(VS.final?' ':'')+VS.partial;VS.partial=''}

/* Browser speech recognition: several alternatives per phrase (we keep the one that reads most like an
   ingredient list), and an automatic restart when
   iPhone Safari stops listening on its own before the participant taps Done. */
function startWebRec(first){
 let r;try{r=new SR()}catch(err){micFail(err);return false}
 r.lang=CFG.lang;r.continuous=true;r.interimResults=true;r.maxAlternatives=5;
 const picked={};
 r.onresult=ev=>{
  let f='',p='';
  for(let i=0;i<ev.results.length;i++){
   const res=ev.results[i];
   if(res.isFinal){
    if(!(i in picked)){let best=res[0].transcript,bs=-1e9;for(let a=0;a<res.length;a++){const sc=ingredientScore(res[a].transcript)+(a===0?0.5:0);if(sc>bs){bs=sc;best=res[a].transcript}}picked[i]=best}
    f+=picked[i]+' ';
   }else p+=res[0].transcript+' ';
  }
  VS.final=(VS.base+' '+f).trim();VS.partial=p.trim();activity();
 };
 r.onerror=ev=>{VS.err=ev.error};
 r.onend=()=>{
  if(VS.rec!==r)return;
  const err=VS.err,elapsed=Date.now()-VS.t0;
  const canRestart=VS.active&&!VS.stopping&&VS.restarts<8&&elapsed<85000&&(!err||(err==='no-speech'&&vText()));
  if(canRestart){VS.base=vText();VS.partial='';VS.err=null;VS.restarts++;log('speech_restart',{after_s:+(elapsed/1000).toFixed(1),heard_so_far:VS.base});if(startWebRec(false))return}
  endVoice(err||'ended');
 };
 VS.rec=r;try{r.start()}catch(err){if(first){micFail(err);return false}endVoice('restart_failed');return false}
 return true;
}
function beginListening(){VS.active=true;VS.t0=Date.now();setV('listening');log('mic_start',{engine:VS.engine})}
function micFail(err){
 const s=String(err&&(err.code||err.reason||err.name||err.message)||err);
 VS.active=false;vClear();
 if(/not_granted|not-allowed|notallowed|denied|permission/i.test(s)){log('mic_denied',{reason:s,engine:VS.engine});setV('denied')}
 else if(/dismiss/i.test(s)){log('mic_prompt_dismissed',{reason:s});VMSG='The microphone prompt was closed. Tap the mic to try again.';setV('ready')}
 else{log('speech_error',{reason:s,engine:VS.engine});setV('error')}
}

 if(VS.engine==='claude'){Promise.resolve().then(()=>dict.stop()).catch(()=>{}).then(()=>endVoice('stopped'))}
 else if(VS.engine==='web'){try{VS.rec.stop()}catch(e){endVoice('stopped')}}

}
function abortVoice(){

 if(was&&VS.engine==='claude'&&dict){try{Promise.resolve(dict.stop()).catch(()=>{})}catch(e){}}

}
function endVoice(reason){
 if(!VS.active)return;VS.active=false;VS.stopping=false;vClear();
 const r=VS.rec;VS.rec=null;
 const err=VS.err;
 if(err==='not-allowed'||err==='service-not-allowed'){log('mic_denied',{reason:err,engine:VS.engine});setV('denied');return}
 const text=vText();
 if(!text){
  if(err&&err!=='no-speech'&&err!=='aborted'){log('speech_error',{reason:err,engine:VS.engine});setV('error')}
  else{log('no_speech',{reason:reason||err||'',engine:VS.engine});setV('nospeech')}

 }

 log('transcript',{heard:text,cleaned:cleaned===text?'(same)':cleaned,seconds:+((Date.now()-VS.t0)/1000).toFixed(1),engine:VS.engine,restarts:VS.restarts||0});
 startProcessing(cleaned);

function startProcessing(text){
 const tok=++VTOKEN;VR={transcript:text,items:[],mode:'voice'};setV('processing');const t0=Date.now();
 setTimeout(()=>{if(tok===VTOKEN)markStep(1)},650);
 setTimeout(()=>{if(tok===VTOKEN)markStep(2)},1150);
 setTimeout(()=>{
  if(tok!==VTOKEN)return;
  const items=parseIngredients(text);plantError(items);VR.items=items;VR.secs=((Date.now()-t0)/1000).toFixed(1);
  log('parse_result',{matched:items.filter(x=>x.foodId).length,unrecognized:items.filter(x=>!x.foodId).length,planted:CFG.plant,items:items.map(x=>x.foodId?x.name:'?'+x.name).join('; ')});
  if(!items.length){log('parse_empty',{text});setV('empty')}else setV('review');
 },1650);
}

function openEdit(mode,idx){

function saveEdit(){
 const E=EDIT,qty=parseFloat(E.qty);
 if(!E.name.trim()){E.err='name';log('edit_invalid',{reason:'no name'});rerenderSheet();return}
 if(!(qty>0)){E.err='qty';log('edit_invalid',{reason:'bad amount',value:E.qty});rerenderSheet();return}
 const it={id:uid(),foodId:E.foodId,name:E.foodId?FOODMAP[E.foodId].name:E.name.trim(),qty,unit:E.unit};
 if(E.mode==='recipe-new'){it.source='manual';S.ingredients.push(it);log('manual_add',{name:it.name,matched:!!it.foodId,amount:fmtAmt(it)});closeSheet();renderAdd();return}
 if(E.mode==='recipe'){const old=S.ingredients[E.idx];it.source=old.source;S.ingredients[E.idx]=it;log('ingredient_edited',{from:old.name,to:it.name,amount:fmtAmt(it)});closeSheet();renderAdd();return}
 if(E.mode==='voice-new'){it.addedInReview=true;VR.items.push(it);log('item_added_in_review',{name:it.name,matched:!!it.foodId});closeSheet();renderVoice();return}
 const old=VR.items[E.idx];
 Object.assign(it,{said:old.said,planted:old.planted,trueFood:old.trueFood,fixed:true});
 const changedFood=old.foodId!==it.foodId;
 if(old.planted==='wrong'&&changedFood)it.planted=null;
 VR.items[E.idx]=it;
 if(!old.foodId||changedFood)log('item_corrected',{via:'edit',from:old.foodId?FOODMAP[old.foodId].name:'?'+old.name,to:it.name,planted:old.planted||'',now_matched:!!it.foodId,review:VR.mode});
 else log('item_edited',{name:it.name,amount:fmtAmt(it),review:VR.mode});
 closeSheet();renderVoice();
}

 if(E.mode==='voice'){const old=VR.items.splice(E.idx,1)[0];log('item_removed',{name:old.name,was_unrecognized:!old.foodId,planted:old.planted||'',review:VR.mode});closeSheet();renderVoice()}
}
function trySave(){

 const miss=Object.keys(S.err).filter(k=>S.err[k]);

 log('recipe_saved',{title:S.title,servings:sv,ingredients:S.ingredients.length,method,by_voice:byVoice,typed,manual,kcal:tot,via});
 S.recipes.forEach(r=>r.fresh=false);
 S.recipes.unshift({id:uid(),name:S.title.trim(),details:`${fmtCal(Math.round(tot/sv))} cal, 1 serving`,added:false,fresh:true,kcal:Math.round(tot/sv)});

  saw_upsell:sh?'yes':'no',upsell_choice:choice,mic_started:first('mic_start')?'yes':'no',voice_completed:va?'yes':'no',ingredients_by_voice:va?va.detail.count:0,
  unresolved_on_add:(va||first('typed_added'))?unres:'',corrections:cnt('item_corrected'),rerecords:cnt('rerecord')+cnt('voice_retry'),
  recipe_saved:rs?'yes':'no',recipes_deleted:cnt('recipe_deleted'),diary_items_deleted:cnt('diary_item_deleted'),logged_new_recipe:E.some(e=>e.type==='recipe_logged'&&e.detail.new_recipe)?'yes':'no',deleted_own_recipe:E.some(e=>e.type==='recipe_deleted'&&e.detail.new_recipe)&&!E.some(e=>e.type==='recipe_delete_undo')?'yes':'no',save_method:rs?rs.detail.method:'',errors:E.filter(e=>e.error).length,off_path_taps:cnt('off_path_tap'),dead_taps:cnt('dead_tap'),voice_log_tile_taps:cnt('voice_log_tile_tap'),
  sec_upsell_to_try:sec(sh,tr),sec_try_to_voice_added:sec(tr,va),sec_add_recipe_to_save:sec(ar,rs),sec_total_to_save:rs?+(rs.t/1000).toFixed(1):''};
}
function fmtT(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function detailStr(d){return Object.keys(d||{}).map(k=>k+'='+(typeof d[k]==='string'?d[k]:JSON.stringify(d[k]))).join(' · ')}
function renderPanel(){
 const sel=(k,opts)=>`<select data-pset="${k}">${opts.map(([v,l])=>`<option value="${v}" ${String(CFG[k])===v?'selected':''}>${l}</option>`).join('')}</select>`;
 const canDl=!!downloadsCap||!inClaude;
 $('#pBody').innerHTML=`
 <section><div id="pEng" class="p-eng"></div><div class="p-hint"><b>Reopening this panel during a session:</b> on a phone, press and hold anywhere with <b>two fingers</b> for about a second, or tap the “Today”, “Add Recipe” or “Voice Assistant” title three times quickly. On a laptop, press <b>Shift+M</b>. When you’re not recording, a round button also shows in the bottom-right corner.</div></section>
 <section><h4>Session</h4><div id="pRec"></div>
  ${isRec()?`<div class="p-row"><button class="p-btn stop" data-pact="end">■ End session</button></div><div class="p-sub">End the session after any follow-up questions. Its data is saved for export.</div>`
   :`<div class="p-row"><input id="pId" placeholder="Participant ID (e.g. P3)" value="${esc(nextId())}"><button class="p-btn primary" data-pact="start">● Start recording</button></div><div class="p-sub">Starting resets the app to the Today screen, starts the clock, and closes this panel. Nothing the participant does is logged until you start.</div>`}</section>
 <section><h4>Live results</h4><div id="pSum" class="p-tiles"></div></section>
 <section><h4>Log what you observe</h4><textarea id="pNote" rows="2" placeholder="e.g. Looked for recipes under My Meals first"></textarea><div class="p-row"><button class="p-btn" data-pact="obs-error">+ Observed error</button><button class="p-btn" data-pact="obs-assist">+ Moderator assist</button><button class="p-btn" data-pact="obs-note">+ Note</button></div></section>
 <section><h4>Test settings</h4>
  <label class="p-set">Voice engine ${sel('engine',[['auto','Real voice (microphone)'],['sim','Simulated: plays the script below']])}</label>
  <label class="p-set">Speech language (browser engine only) ${sel('lang',[['en-US','English (US)'],['en-IN','English (India)'],['en-GB','English (UK)']])}<span class="p-sub" style="display:block">If ingredient names keep coming out wrong, try switching the language here (e.g. English (India) for Indian dish names). Check what was heard in the event log (“transcript” rows).</span></label>
  <label class="p-set">When the upsell appears ${sel('trigger',[['focus','When they tap the Ingredients box (or Add Ingredient)'],['load','2 seconds after Add Recipe opens'],['off','Never (control group)']])}</label>
  <label class="p-set">Bulk Import toggle starts ${sel('bulkDefault',[['true','On (as in Figma)'],['false','Off']])}</label>
  <label class="p-set">Planted parsing error ${sel('plant',[['off','None: show real results'],['unrec','Last item shows as “not recognized”'],['wrong','Last item silently matched to the wrong food']])}</label>
  <label class="p-check"><input type="checkbox" data-pset="showAd" ${CFG.showAd?'checked':''}> Show the ad banners</label>
  <label class="p-set">Simulated script<textarea data-pset="script" rows="3">${esc(CFG.script)}</textarea></label>
  <div class="p-sub">Start a new session after changing settings so each participant gets the same setup.</div>
 </section>
 <section><h4>Task to read aloud</h4><pre class="p-card">${esc(TASK)}</pre><button class="p-btn" data-pact="copy-task">Copy task</button></section>
 <section><h4>Recipe card for participants</h4><pre class="p-card">${esc(CARD)}</pre><button class="p-btn" data-pact="copy-card">Copy card text</button></section>
 <section><h4>Event log (this session) <span id="pCount"></span></h4><div id="pLog" class="p-log"></div></section>
 <section><h4>Export</h4><div class="p-col">
  <button data-pact="copy-summary">Copy summary CSV (one row per participant)</button>
  <button data-pact="copy-all">Copy all events CSV (every session)</button>
  <button data-pact="copy-session">Copy this session’s events CSV</button>
  ${canDl?'<button data-pact="dl-summary">Download summary CSV</button><button data-pact="dl-all">Download all events CSV</button>':''}
 </div><div class="p-sub" id="pExpMsg"></div><textarea id="pExport" class="p-export" rows="4" readonly placeholder="Exported text also appears here, in case copying is blocked."></textarea>
 <div class="p-sub" id="pStored"></div><button class="p-btn danger" data-pact="clear">Delete saved sessions</button></section>`;
 refreshEngineLabel();updatePanelLive();
}
function updatePanelLive(){
 if(!$('#panel').classList.contains('open')||!$('#pSum'))return;
updateRecStatus();
 if(!SESSION){$('#pSum').innerHTML='<div class="p-sub" style="grid-column:1/-1">Results appear here once you start recording.</div>';$('#pLog').innerHTML='';$('#pCount').textContent='';$('#pStored').textContent=doneSessions().length+' session(s) saved in this browser.';return}
 const m=metrics(SESSION);
 const tile=(l,v,cls)=>`<div class="p-tile ${cls||''}"><span>${l}</span><b>${esc(v===''?'–':v)}</b></div>`;
 const y=v=>v==='yes'?'yes':'';
 $('#pSum').innerHTML=[tile('Found My Recipes',m.found_my_recipes+(m.sec_to_my_recipes!==''?` (${m.sec_to_my_recipes}s)`:''),y(m.found_my_recipes)),tile('Reached Add Recipe',m.reached_add_recipe+(m.sec_to_add_recipe!==''?` (${m.sec_to_add_recipe}s)`:''),y(m.reached_add_recipe)),
  tile('Saw upsell',m.saw_upsell,y(m.saw_upsell)),tile('Upsell choice',m.upsell_choice,m.upsell_choice==='Tried it'?'yes':''),
  tile('Voice completed',m.voice_completed+(m.voice_completed==='yes'?` (${m.ingredients_by_voice})`:''),y(m.voice_completed)),tile('Recipe saved (task done)',m.recipe_saved+(m.save_method?` · ${m.save_method}`:''),y(m.recipe_saved)),
  tile('Errors',m.errors,m.errors?'bad':''),tile('Left unresolved',m.unresolved_on_add,m.unresolved_on_add>0?'bad':''),
  tile('Corrections in review',m.corrections),tile('Off-path / dead taps',m.off_path_taps+' / '+m.dead_taps),
  tile('Recipes deleted',m.recipes_deleted+(m.deleted_own_recipe==='yes'?' (incl. theirs)':''),m.deleted_own_recipe==='yes'?'bad':''),tile('Voice log tile taps',m.voice_log_tile_taps),
  tile('Upsell → Try (s)',m.sec_upsell_to_try),tile('Try → added (s)',m.sec_try_to_voice_added),
  tile('Add Recipe → saved (s)',m.sec_add_recipe_to_save),tile('Total time to save (s)',m.sec_total_to_save)].join('');
 $('#pLog').innerHTML=SESSION.events.slice().reverse().map(e=>`<div class="lg ${e.error?'err':e.type==='off_path_tap'?'off':''}"><span class="lg-t">${fmtT(e.t)}</span><span class="lg-e">${esc(e.type)}</span><span class="lg-d">${esc(e.screen)}${Object.keys(e.detail).length?' · '+esc(detailStr(e.detail)):''}</span></div>`).join('');
 $('#pCount').textContent='· '+SESSION.events.length+' events';
 $('#pStored').textContent=SESSIONS.filter(s=>s.events.length>1).length+' session(s) saved in this browser.';
}
function updateRecStatus(){
 const el=$('#pRec');if(!el)return;
 if(!SESSION){el.className='rec';el.innerHTML='<span class="rd"></span><b>Not recording</b>';return}
 const done=SESSION.events.find(e=>e.type==='recipe_saved');
 const end=SESSION.ended||Date.now(),el2=fmtT(end-SESSION.started);
 if(isRec()){el.className='rec on';el.innerHTML=`<span class="rd"></span><b>Recording · ${esc(SESSION.participant)}</b>${done?`<span style="font-size:12px">task done at ${fmtT(done.t)}</span>`:''}<span class="rt">${el2}</span>`}
 else{el.className='rec ended';el.innerHTML=`<span class="rd"></span><b>Ended · ${esc(SESSION.participant)}</b><span style="font-size:12px">saved</span><span class="rt">${el2}</span>`}
}
function togglePanel(open){const p=$('#panel');const o=open==null?!p.classList.contains('open'):open;p.classList.toggle('open',o);if(o)renderPanel()}
const csvq=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
function eventsCSV(list){const rows=[['participant','session','seconds','screen','event','is_error','details']];list.forEach(s=>s.events.forEach(e=>rows.push([s.participant,s.id,(e.t/1000).toFixed(1),e.screen,e.type,e.error?1:0,detailStr(e.detail)])));return rows.map(r=>r.map(csvq).join(',')).join('\n')}
function summaryCSV(list){if(!list.length)return '';const ms=list.map(metrics);const keys=Object.keys(ms[0]);return [keys.map(csvq).join(',')].concat(ms.map(m=>keys.map(k=>csvq(m[k])).join(','))).join('\n')}
const doneSessions=()=>SESSIONS.filter(s=>s.events.length>1);
function pmsg(t){const el=$('#pExpMsg');if(el)el.textContent=t}
function copyOut(text,label){const ta=$('#pExport');ta.value=text;let p;try{p=navigator.clipboard.writeText(text)}catch(e){p=Promise.reject(e)}Promise.resolve(p).then(()=>pmsg('Copied: '+label)).catch(()=>{pmsg('Copying was blocked. Select the text below and copy it.');ta.focus();ta.select()})}
function downloadOut(text,name){
 $('#pExport').value=text;
 if(downloadsCap){Promise.resolve().then(()=>downloadsCap.save({filename:name,data:text})).then(()=>pmsg('Saved '+name)).catch(()=>pmsg('Download was declined or blocked. The text is below.'));return}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove();pmsg('Downloaded '+name)}catch(e){pmsg('Download blocked. The text is below.')}
}
let clearArm=false;
$('#panel').addEventListener('click',e=>{
 const b=e.target.closest('[data-pact]');if(!b)return;const a=b.dataset.pact;const note=()=>{const n=$('#pNote');const v=n.value.trim();n.value='';return v};
 const stamp=new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
 switch(a){
  case 'close':togglePanel(false);break;
  case 'start':{const id=$('#pId').value.trim()||nextId();resetApp();newSession(id);log('screen_view',{screen:'today'});updateRecBadge();renderPanel();pmsg('');setTimeout(()=>togglePanel(false),900);break}
  case 'end':endSession();renderPanel();break;
  case 'obs-error':log('observed_error',{note:note()});break;
  case 'obs-assist':log('moderator_assist',{note:note()});break;
  case 'obs-note':log('note',{note:note()});break;
  case 'copy-task':copyOut(TASK,'task');break;
  case 'copy-card':copyOut(CARD,'recipe card');break;
  case 'copy-session':if(SESSION)copyOut(eventsCSV([SESSION]),'this session');else pmsg('No session yet.');break;
  case 'copy-all':copyOut(eventsCSV(doneSessions()),'all events');break;
  case 'copy-summary':copyOut(summaryCSV(doneSessions()),'summary');break;
  case 'dl-all':downloadOut(eventsCSV(doneSessions()),'voice-upsell-events-'+stamp+'.csv');break;
  case 'dl-summary':downloadOut(summaryCSV(doneSessions()),'voice-upsell-summary-'+stamp+'.csv');break;
  case 'clear':if(!clearArm){clearArm=true;b.textContent='Tap again to delete every saved session';setTimeout(()=>{clearArm=false;b.textContent='Delete saved sessions'},4000)}else{clearArm=false;SESSIONS=isRec()?[SESSION]:[];if(!isRec())SESSION=null;store.set('vp_sessions_v2',[]);renderPanel();pmsg('Saved sessions deleted.')}break;
 }
});
$('#panel').addEventListener('change',e=>{
 const k=e.target.dataset.pset;if(!k)return;
 let v=e.target.type==='checkbox'?e.target.checked:e.target.value;if(k==='bulkDefault')v=v==='true';
 CFG[k]=v;saveCfg();
 if(isRec())SESSION.config={engine:CFG.engine,trigger:CFG.trigger,plant:CFG.plant,lang:CFG.lang};
 log('setting_changed',{[k]:k==='script'?'(edited)':CFG[k]});
 if(k==='showAd'){renderToday();renderAdd()}if(k==='engine'||k==='lang')refreshEngineLabel();
});
$('#panel').addEventListener('input',e=>{if(e.target.dataset.pset==='script'){CFG.script=e.target.value;saveCfg()}});
$('#modBtn').addEventListener('click',()=>togglePanel());
document.addEventListener('keydown',e=>{if(e.shiftKey&&(e.key==='M'||e.key==='m')&&!/input|textarea|select/i.test(e.target.tagName)){e.preventDefault();togglePanel()}if(e.key==='Escape'&&$('#panel').classList.contains('open'))togglePanel(false)});
setInterval(()=>{const c=$('#clock');if(c){const d=new Date();c.textContent=(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0')}if($('#panel').classList.contains('open'))updateRecStatus()},1000);


/* ================= Swipe to delete (My Recipes rows + Today diary items) ================= */
const SW_W=88;let SWG={sw:null},openSw=null,swSwallow=false,lastDeleted=null,lastDiaryDeleted=null;
function swallowNextClick(){swSwallow=true;setTimeout(()=>{swSwallow=false},450)}
function swClose(sw){if(!sw)return;const fg=sw.querySelector('.sw-fg');if(fg)fg.style.transform='';sw.classList.remove('open');if(openSw===sw)openSw=null;setTimeout(()=>{if(!sw.classList.contains('open')&&!sw.classList.contains('drag'))sw.classList.remove('reveal')},270)}
const swKindLabel=sw=>sw.dataset.kind==='logged'?'diary_item':'recipe';
function swEnd(e){
 const g=SWG;if(!g.sw||(e&&e.pointerId!==g.pid))return;SWG={sw:null};
 if(!g.drag)return;
 swallowNextClick();g.sw.classList.remove('drag');
 if(g.dx<-SW_W/2){g.fg.style.transform=`translateX(${-SW_W}px)`;g.sw.classList.add('open');openSw=g.sw;log(swKindLabel(g.sw)+'_swipe_open',{name:g.sw.dataset.name||''})}
 else swClose(g.sw);
}
[$('#sSearch'),$('#sToday')].forEach(box=>{
 box.addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  const sw=e.target.closest('.sw');
  if(openSw){if(e.target.closest('.sw-del')&&sw===openSw)return;log(swKindLabel(openSw)+'_swipe_closed',{via:'tap'});swClose(openSw);swallowNextClick();return}
  if(!sw)return;
  SWG={sw,fg:sw.querySelector('.sw-fg'),x0:e.clientX,y0:e.clientY,dx:0,drag:false,pid:e.pointerId};
 });
 box.addEventListener('pointermove',e=>{
  const g=SWG;if(!g.sw||e.pointerId!==g.pid)return;
  const dx=e.clientX-g.x0,dy=e.clientY-g.y0;
  if(!g.drag){
   if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2){g.drag=true;g.sw.classList.add('reveal','drag');try{g.fg.setPointerCapture(g.pid)}catch(err){}}
   else{if(Math.abs(dy)>10)SWG={sw:null};return}
  }
  let x=Math.min(0,dx);if(x<-SW_W)x=-SW_W+(x+SW_W)*0.3;
  g.dx=x;g.fg.style.transform=`translateX(${x}px)`;e.preventDefault();
 });
 box.addEventListener('pointerup',swEnd);box.addEventListener('pointercancel',swEnd);
 box.addEventListener('scroll',()=>{if(openSw)swClose(openSw)},true);
});

/* ================= Boot ================= */
$('#statusInd').innerHTML=FI.indicators;
function resetApp(){setTimeout(syncTheme,0);
 closeVoice();const L=$('#layer');L.classList.remove('open');L.innerHTML='';SHEET=null;EDIT=null;$('#toast').classList.remove('show');
 S=freshState();NAV.search=false;NAV.add=false;NAV.tab='history';openSw=null;lastDeleted=null;lastDiaryDeleted=null;SWG={sw:null};
 $('#sSearch').classList.add('off-right');$('#sAdd').classList.add('off-bottom');$('#sToday').classList.remove('behind');
 renderToday();renderSearch();renderAdd();
}
resetApp();updateRecBadge();
togglePanel(true); // moderator starts recording from the panel
window.addEventListener('hashchange',()=>{if(location.hash==='#moderator')togglePanel(true)});
})();
</script>
</body>
